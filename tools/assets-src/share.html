<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; box-sizing: border-box; padding: 64px 80px; display: flex; align-items: center; gap: 56px; color: #fff; font-family: "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(700px 400px at 95% 0%, rgba(242,183,5,.35), transparent 60%), radial-gradient(500px 360px at 0% 110%, rgba(217,30,24,.30), transparent 60%), linear-gradient(150deg, #073d1d, #0f7a3a); position: relative; overflow: hidden; }
  .stripe { position: absolute; left: 0; right: 0; top: 0; height: 14px; background: linear-gradient(90deg, #d91e18 33.3%, #f2b705 33.3% 66.6%, #0f7a3a 66.6%); }
  img { width: 360px; height: 360px; filter: drop-shadow(0 14px 30px rgba(0,0,0,.35)); flex: none; }
  small { display: block; font-size: 26px; letter-spacing: .14em; text-transform: uppercase; opacity: .85; font-weight: 700; margin-bottom: 14px; }
  h1 { font-size: 84px; line-height: 1.02; margin: 0 0 22px; font-weight: 800; letter-spacing: -.02em; }
  h1 em { font-style: normal; color: #f2b705; }
  p { font-size: 34px; margin: 0; opacity: .95; line-height: 1.3; }
</style>
<body>
<div class="stripe"></div>
<img src="../../assets/logo.svg" alt="">
<div>
  <small>Mouvement Patriotique pour le Progrès Estudiantin</small>
  <h1>La force de la jeunesse, <em>l'avenir du Faso.</em></h1>
  <p>Tirage au sort quotidien · Boîte à idées · Chat anonyme</p>
</div>
</body>
